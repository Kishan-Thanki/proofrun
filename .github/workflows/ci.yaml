name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  quality:
    name: Quality & Tests
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: make install

      - name: Run code quality & coverage checks
        run: make check

      - name: Run integration scenarios (local demo API, no network)
        run: make integration

  build:
    name: Build Package
    runs-on: ubuntu-24.04
    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: make install

      - name: Build distributions
        run: make build

      - name: Verify distributions
        run: |
          ls -lh dist/
          test -f dist/*.whl
          test -f dist/*.tar.gz

      - name: Install the built packages in a clean environment
        run: make dist-smoke

  docker:
    name: Docker Image
    runs-on: ubuntu-24.04
    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build image
        run: docker build --tag proofrun:ci .

      - name: Smoke test image
        run: |
          docker run --rm proofrun:ci --version
          docker run --rm -v "$PWD/scenarios:/monitors:ro" \
            -e DEMO_PASSWORD=demo-password \
            proofrun:ci /monitors/resilient.yaml --validate
