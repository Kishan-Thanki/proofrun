<svg xmlns="http://www.w3.org/2000/svg" width="1648" height="928" viewBox="0 0 1648 928" role="img" aria-labelledby="title desc">
<title id="title">Proofrun — API response contract failure</title>
<desc id="desc">Illustrative Proofrun CLI output showing a response returning HTTP 200 but failing JSON Schema validation.</desc>
<defs>
  <style>
    .sans { font-family: Inter, "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "Fira Code", "SFMono-Regular", Menlo, Consolas, monospace; }
  </style>
  <filter id="softShadow" x="-6%" y="-8%" width="112%" height="120%"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#1A222C" flood-opacity="0.14"/></filter>
</defs>
<rect width="1648" height="928" fill="#E9EDF1"/>
<circle cx="1460" cy="80" r="240" fill="#DCE4EB" opacity="0.32"/>
<circle cx="90" cy="900" r="210" fill="#DCE4EB" opacity="0.24"/>
<g class="sans">
  <text x="100" y="80" font-size="30" font-weight="750" fill="#1A222C" letter-spacing="-0.8">Proofrun</text>
  <circle cx="104" cy="120" r="3.5" fill="#2E8BB8"/>
  <text x="118" y="125" class="mono" font-size="11" font-weight="700" fill="#6B7685" letter-spacing="2">API RESPONSE VALIDATION</text>
  <text x="100" y="192" font-size="46" font-weight="800" fill="#1A222C" letter-spacing="-1.5">Response contract failed</text>
  <text x="100" y="229" font-size="18" fill="#5C6674">HTTP 200 received. The JSON response failed its schema assertion.</text>
</g>
<g class="mono">
  <rect x="1322" y="87" width="226" height="42" rx="21" fill="#F7E1E2"/>
  <circle cx="1345" cy="108" r="4" fill="#A5323A"/>
  <text x="1360" y="113" font-size="12" font-weight="700" fill="#A5323A" letter-spacing="1.1">FAILED</text>
</g>
<!-- Terminal panel styled to match the Proofrun visual theme. -->
<g filter="url(#softShadow)">
  <rect x="100" y="270" width="1448" height="534" rx="12" fill="#292929"/>
  <path d="M112 270 H1536 A12 12 0 0 1 1548 282 V316 H100 V282 A12 12 0 0 1 112 270 Z" fill="#343638"/>
  <circle cx="125" cy="293" r="6.5" fill="#FF5F57"/><circle cx="147" cy="293" r="6.5" fill="#FEBC2E"/><circle cx="169" cy="293" r="6.5" fill="#28C840"/>
  <text x="824" y="299" text-anchor="middle" class="sans" font-size="15" font-weight="700" fill="#C5C8C6">proofrun · CLI output</text>
</g>
<g class="mono" font-size="19">
  <text x="128" y="356" fill="#68A0B3" font-weight="700">$</text>
  <text x="151" y="356" fill="#C5C8C6">proofrun scenarios/crud.yaml</text>
  <text x="128" y="382" fill="#68A0B3" font-weight="700">Scenario:</text>
  <text x="247" y="382" fill="#F0F3F7" font-weight="700">Create and verify resource</text>
</g>
