<svg xmlns="http://www.w3.org/2000/svg" width="1648" height="928" viewBox="0 0 1648 928" role="img" aria-labelledby="title desc">
  <title id="title">Proofrun — Verify the entire API journey</title>
  <desc id="desc">Light editorial banner on cool pearl. Left: dark-slate Proofrun wordmark with a bone check, "API MONITORING" eyebrow with an ice dot, the headline "Verify the entire API journey" in dark slate and ice blue, a tagline, and three numbered features. Right: two real Proofrun terminal outputs stacked. Top (PASSING RUN): Log in, Fetch profile, Fetch orders — all PASS 200 — Status PASSED, Total Latency 46.42 ms. Bottom (FAILING RUN): Log in PASS 200 22.49 ms; Fetch profile FAIL 500 53.52 ms with "Status code mismatch: expected 200, got 500" — Status FAILED, Total Latency 86.22 ms.</desc>

  <defs>
    <style>
      .sans { font-family: "Inter", "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif; }
      .mono { font-family: "JetBrains Mono", "Fira Code", "SF Mono", Menlo, Consolas, ui-monospace, monospace; }
    </style>
    <filter id="softShadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1A222C" flood-opacity="0.13"/>
    </filter>
  </defs>

  <!-- =================== BACKGROUND =================== -->
  <rect width="1648" height="928" fill="#E9EDF1"/>

  <!-- Crop marks -->
  <g stroke="#1A222C" stroke-opacity="0.22" stroke-width="1">
    <line x1="32" y1="32" x2="68" y2="32"/><line x1="32" y1="32" x2="32" y2="68"/>
    <line x1="1580" y1="32" x2="1616" y2="32"/><line x1="1616" y1="32" x2="1616" y2="68"/>
    <line x1="32" y1="896" x2="68" y2="896"/><line x1="32" y1="860" x2="32" y2="896"/>
    <line x1="1580" y1="896" x2="1616" y2="896"/><line x1="1616" y1="860" x2="1616" y2="896"/>
  </g>

  <!-- =================== LEFT COLUMN =================== -->
  <g class="sans">
    <!-- Logo — dark slate verification mark -->
    <rect x="100" y="84" width="48" height="48" rx="12" fill="#1A222C"/>
    <path d="M113 108l7 7 14-15" fill="none" stroke="#F0F3F7" stroke-width="4"
          stroke-linecap="round" stroke-linejoin="round"/>
    <text x="162" y="118" font-size="26" font-weight="700" fill="#1A222C" letter-spacing="-0.3">Proofrun</text>

    <!-- Eyebrow -->
    <rect x="100" y="172" width="6" height="6" fill="#4FB8E0"/>
    <text x="116" y="180" class="mono" font-size="11" font-weight="600" fill="#6B7685" letter-spacing="2.2">API MONITORING</text>

    <!-- Headline -->
    <text x="100" y="312" font-size="54" font-weight="800" fill="#1A222C" letter-spacing="-2">Verify the entire</text>
    <text x="100" y="380" font-size="54" font-weight="800" fill="#2E8BB8" letter-spacing="-2">API journey</text>
    <rect x="100" y="404" width="88" height="2" fill="#1A222C" opacity="0.28"/>

    <!-- Tagline -->
    <rect x="100" y="448" width="2" height="66" fill="#1A222C" opacity="0.20"/>
    <text x="118" y="462" font-size="17" fill="#5C6674">Most monitors only check if an endpoint</text>
    <text x="118" y="487" font-size="17" fill="#5C6674">returned 200. Proofrun checks if the</text>
    <text x="118" y="512" font-size="17" fill="#5C6674">journey actually worked.</text>

    <!-- Features -->
    <text x="100" y="590" class="mono" font-size="12" font-weight="700" fill="#2E8BB8" letter-spacing="1">01</text>
    <text x="136" y="590" font-size="15" font-weight="500" fill="#3D4655">Chained requests with variable extraction</text>

    <text x="100" y="628" class="mono" font-size="12" font-weight="700" fill="#2E8BB8" letter-spacing="1">02</text>
    <text x="136" y="628" font-size="15" font-weight="500" fill="#3D4655">Per-step assertions on status, schema, latency</text>

    <text x="100" y="666" class="mono" font-size="12" font-weight="700" fill="#2E8BB8" letter-spacing="1">03</text>
    <text x="136" y="666" font-size="15" font-weight="500" fill="#3D4655">Exit code 0 / 1 — drops straight into CI</text>

    <!-- Footer note -->
    <rect x="100" y="740" width="60" height="1" fill="#1A222C" opacity="0.22"/>
    <text x="100" y="768" class="mono" font-size="12" fill="#7A8494" letter-spacing="0.5">one YAML file · three steps · zero blind spots</text>
  </g>

  <!-- =================== RIGHT COLUMN — PASS =================== -->
  <g class="mono">
    <circle cx="708" cy="138" r="4" fill="#54681E"/>
    <text x="722" y="143" font-size="11" font-weight="700" fill="#54681E" letter-spacing="2.4">PASSING RUN</text>
    <line x1="860" y1="139" x2="1591" y2="139" stroke="#54681E" stroke-opacity="0.35"/>
  </g>

  <g transform="translate(700, 164) scale(0.72)" filter="url(#softShadow)">
    <rect x="1" y="1" width="1236" height="389.6" rx="8" fill="#292929"/>
    <circle cx="26" cy="22" r="7" fill="#ff5f57"/>
    <circle cx="48" cy="22" r="7" fill="#febc2e"/>
    <circle cx="70" cy="22" r="7" fill="#28c840"/>
    <text x="618" y="27" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#c5c8c6" text-anchor="middle">proofrun</text>

    <g transform="translate(9, 41)" class="mono" font-size="20">
      <text x="0" y="20" fill="#68a0b3" font-weight="bold">$</text>
      <text x="12.2" y="20" fill="#c5c8c6"> proofrun scenarios/auth.yaml</text>

      <text x="440" y="68.8" fill="#68a0b3" font-weight="bold">Scenario:</text>
      <text x="550" y="68.8" fill="#c5c8c6" font-weight="bold">Login and fetch orders</text>

      <g fill="none" stroke="#c5c8c6" stroke-width="1.6">
        <rect x="0" y="83" width="1207.8" height="156.6"/>
        <line x1="378.2" y1="83" x2="378.2" y2="239.6"/>
        <line x1="549"   y1="83" x2="549"   y2="239.6"/>
        <line x1="719.8" y1="83" x2="719.8" y2="239.6"/>
        <line x1="915"   y1="83" x2="915"   y2="239.6"/>
        <line x1="0" y1="138" x2="1207.8" y2="138"/>
      </g>

      <g fill="#98729f" font-weight="bold" font-size="19">
        <text x="20"    y="117.6">Step Name</text>
        <text x="463.6" y="117.6" text-anchor="middle">Status</text>
        <text x="634.4" y="117.6" text-anchor="middle">HTTP Code</text>
        <text x="817.4" y="117.6" text-anchor="middle">Latency</text>
        <text x="935"   y="117.6">Error Details</text>
      </g>

      <g font-size="19">
        <text x="20"    y="166.4" fill="#868887">Log in</text>
        <text x="463.6" y="166.4" fill="#98a84b" font-weight="bold" text-anchor="middle">PASS</text>
        <text x="699.8" y="166.4" fill="#98a84b" text-anchor="end">200</text>
        <text x="895"   y="166.4" fill="#c5c8c6" text-anchor="end">26.49 ms</text>
        <text x="935"   y="166.4" fill="#cc555a">-</text>

        <text x="20"    y="190.8" fill="#868887">Fetch profile</text>
        <text x="463.6" y="190.8" fill="#98a84b" font-weight="bold" text-anchor="middle">PASS</text>
        <text x="699.8" y="190.8" fill="#98a84b" text-anchor="end">200</text>
        <text x="895"   y="190.8" fill="#c5c8c6" text-anchor="end">2.69 ms</text>
        <text x="935"   y="190.8" fill="#cc555a">-</text>

        <text x="20"    y="215.2" fill="#868887">Fetch orders</text>
        <text x="463.6" y="215.2" fill="#98a84b" font-weight="bold" text-anchor="middle">PASS</text>
        <text x="699.8" y="215.2" fill="#98a84b" text-anchor="end">200</text>
        <text x="895"   y="215.2" fill="#c5c8c6" text-anchor="end">2.34 ms</text>
        <text x="935"   y="215.2" fill="#cc555a">-</text>
      </g>

      <rect x="0" y="264" width="540" height="48.8" rx="6" fill="none" stroke="#98a84b" stroke-width="1.6"/>
      <rect x="240" y="258" width="80" height="12" fill="#292929"/>
      <text x="280" y="268" fill="#98a84b" font-weight="bold" font-size="13" text-anchor="middle">Summary</text>

      <text x="20"  y="294" fill="#c5c8c6" font-weight="bold" font-size="19">Status:</text>
      <text x="108" y="294" fill="#98a84b" font-weight="bold" font-size="19">PASSED</text>
      <text x="205" y="294" fill="#c5c8c6" font-weight="bold" font-size="19">Total Latency:</text>
      <text x="400" y="294" fill="#68a0b3" font-size="19">46.42 ms</text>
    </g>
  </g>

  <!-- =================== RIGHT COLUMN — FAIL =================== -->
  <g class="mono">
    <circle cx="708" cy="480" r="4" fill="#A5323A"/>
    <text x="722" y="485" font-size="11" font-weight="700" fill="#A5323A" letter-spacing="2.4">FAILING RUN</text>
    <line x1="860" y1="481" x2="1591" y2="481" stroke="#A5323A" stroke-opacity="0.35"/>
  </g>

  <g transform="translate(700, 506) scale(0.72)" filter="url(#softShadow)">
    <rect x="1" y="1" width="1236" height="389.6" rx="8" fill="#292929"/>
    <circle cx="26" cy="22" r="7" fill="#ff5f57"/>
    <circle cx="48" cy="22" r="7" fill="#febc2e"/>
    <circle cx="70" cy="22" r="7" fill="#28c840"/>
    <text x="618" y="27" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#c5c8c6" text-anchor="middle">proofrun</text>

    <g transform="translate(9, 41)" class="mono" font-size="20">
      <text x="0" y="20" fill="#68a0b3" font-weight="bold">$</text>
      <text x="12.2" y="20" fill="#c5c8c6"> proofrun scenarios/auth.yaml</text>

      <text x="440" y="68.8" fill="#68a0b3" font-weight="bold">Scenario:</text>
      <text x="550" y="68.8" fill="#c5c8c6" font-weight="bold">Login and fetch orders</text>

      <g fill="none" stroke="#c5c8c6" stroke-width="1.6">
        <rect x="0" y="83" width="1207.8" height="156.6"/>
        <line x1="341.6" y1="83" x2="341.6" y2="239.6"/>
        <line x1="500.2" y1="83" x2="500.2" y2="239.6"/>
        <line x1="658.8" y1="83" x2="658.8" y2="239.6"/>
        <line x1="841.8" y1="83" x2="841.8" y2="239.6"/>
        <line x1="0" y1="138" x2="1207.8" y2="138"/>
      </g>

      <g fill="#98729f" font-weight="bold" font-size="19">
        <text x="20"    y="117.6">Step Name</text>
        <text x="420.9" y="117.6" text-anchor="middle">Status</text>
        <text x="579.5" y="117.6" text-anchor="middle">HTTP Code</text>
        <text x="750.3" y="117.6" text-anchor="middle">Latency</text>
        <text x="861.8" y="117.6">Error Details</text>
      </g>

      <g font-size="19">
        <text x="20"    y="166.4" fill="#868887">Log in</text>
        <text x="420.9" y="166.4" fill="#98a84b" font-weight="bold" text-anchor="middle">PASS</text>
        <text x="638.8" y="166.4" fill="#98a84b" text-anchor="end">200</text>
        <text x="821.8" y="166.4" fill="#c5c8c6" text-anchor="end">22.49 ms</text>
        <text x="861.8" y="166.4" fill="#cc555a">-</text>

        <text x="20"    y="190.8" fill="#868887">Fetch profile</text>
        <text x="420.9" y="190.8" fill="#cc555a" font-weight="bold" text-anchor="middle">FAIL</text>
        <text x="638.8" y="190.8" fill="#cc555a" text-anchor="end">500</text>
        <text x="821.8" y="190.8" fill="#c5c8c6" text-anchor="end">53.52 ms</text>
        <text x="861.8" y="190.8" fill="#cc555a">Status code mismatch:</text>
        <text x="861.8" y="215.2" fill="#cc555a">expected 200, got 500</text>
      </g>

      <rect x="0" y="264" width="540" height="48.8" rx="6" fill="none" stroke="#cc555a" stroke-width="1.6"/>
      <rect x="240" y="258" width="80" height="12" fill="#292929"/>
      <text x="280" y="268" fill="#cc555a" font-weight="bold" font-size="13" text-anchor="middle">Summary</text>

      <text x="20"  y="294" fill="#c5c8c6" font-weight="bold" font-size="19">Status:</text>
      <text x="108" y="294" fill="#cc555a" font-weight="bold" font-size="19">FAILED</text>
      <text x="200" y="294" fill="#c5c8c6" font-weight="bold" font-size="19">Total Latency:</text>
      <text x="400" y="294" fill="#68a0b3" font-size="19">86.22 ms</text>
    </g>
  </g>

  <!-- =================== FOOTER =================== -->
  <line x1="100" y1="836" x2="1591" y2="836" stroke="#1A222C" stroke-opacity="0.12"/>
  <text x="845" y="866" class="mono" font-size="11" fill="#7A8494" text-anchor="middle" letter-spacing="1.2">REAL TERMINAL OUTPUT · proofrun scenarios/auth.yaml</text>
</svg>
