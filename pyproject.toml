[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proofrun"
version = "0.3.0"
description = "Synthetic API monitoring as code daemon."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["api", "monitoring", "synthetic-monitoring", "yaml", "http", "devops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "uvloop>=0.19.0; sys_platform != 'win32'",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "fastjsonschema>=2.19.1",
    "jsonpath-ng>=1.13.0",
    "PyYAML>=6.0.1",
    "typer>=0.11.0",
    "rich>=13.7.0",
]

[project.urls]
Homepage = "https://github.com/Kishan-Thanki/proofrun"
Repository = "https://github.com/Kishan-Thanki/proofrun"
Issues = "https://github.com/Kishan-Thanki/proofrun/issues"
Changelog = "https://github.com/Kishan-Thanki/proofrun/blob/main/CHANGELOG.md"

[project.scripts]
proofrun = "proofrun.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/proofrun"]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.8.0",
    "pyright>=1.1.390",
    "pre-commit>=4.0.0",
    "pytest-cov>=7.1.0",
    "pip-audit>=2.10.1",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.pyright]
include = [
    "src",
    "tests",
]
extraPaths = [
    "src",
]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/proofrun"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
